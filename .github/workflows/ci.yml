name: CI

on:
  push:
    branches: [main]
    # the daily data commit (data, monitoring, page) does not need CI
    paths-ignore: ["data/live/**", "monitoring/**", "site/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Ruff (rules in pyproject.toml)
        run: |
          pip install ruff==0.17.3
          ruff check --output-format github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            constraints.txt
      - name: Install dependencies (exact versions from constraints.txt)
        run: pip install -r requirements-pipeline.txt -c constraints.txt
      - name: Run tests
        run: pytest -v

  # Preview of the forecast page with this change, from the data committed in the repo.
  # Download the artifact from the run summary and open index.html in a browser.
  site-preview:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            constraints.txt
      - run: pip install -r requirements-pipeline.txt -c constraints.txt
      - name: Build page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build_site.py --out preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-preview-${{ github.sha }}
          path: preview/index.html
          retention-days: 14
      - name: Summary
        run: echo "Page preview built from this commit. Download **site-preview-${{ github.sha }}** from the artifacts below and open index.html." >> "$GITHUB_STEP_SUMMARY"

  # The API and dashboard images are not deployed, but they must keep building and starting.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build images
        run: |
          docker build -f Dockerfile.api -t airquality-api:ci .
          docker build -f Dockerfile.streamlit -t airquality-ui:ci .
      - name: Start containers
        run: |
          docker network create aq
          docker run -d --name api --network aq -p 8000:8000 airquality-api:ci
          docker run -d --name ui --network aq -p 8501:8501 -e API_BASE=http://api:8000 airquality-ui:ci
      - name: Wait for health checks
        run: |
          for name in api ui; do
            for i in $(seq 1 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = healthy ] && { echo "$name healthy"; break; }
              [ "$i" = 60 ] && { echo "::error::$name not healthy (status: $status)"; exit 1; }
              sleep 3
            done
          done
      - name: API smoke test (health, metadata, a real 24h forecast)
        run: |
          docker cp scripts/smoke_test_api.py api:/app/smoke_test_api.py
          docker exec -e API_BASE=http://127.0.0.1:8000 api python smoke_test_api.py
      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs ui || true
