name: Deploy to Hugging Face Spaces

# Publishes site/index.html (built by the daily job) as a free *static* Space.
# Needs repository secret HF_TOKEN (write access) and variable HF_SPACE_ID, e.g. "username/airquality-paca".
on:
  push:
    branches: [main]
    paths: ["site/**", "deploy/huggingface/**", ".github/workflows/deploy-hf.yml"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::notice::HF_TOKEN secret or HF_SPACE_ID variable not set; skipping deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          # the daily job pushes the new page before calling this workflow
          ref: main
          sparse-checkout: |
            site
            deploy/huggingface

      - name: Stage the page
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          test -f site/index.html || { echo "::error::site/index.html missing. Run the Daily forecast workflow first."; exit 1; }
          mkdir space
          cp site/index.html deploy/huggingface/README.md space/
          ls -la space

      - name: Upload to Space
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="space",
              commit_message=f"Daily forecast page {os.environ['GITHUB_SHA'][:7]}",
              # remove anything else (e.g. files from the earlier Docker attempt)
              delete_patterns=["*"],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          EOF
