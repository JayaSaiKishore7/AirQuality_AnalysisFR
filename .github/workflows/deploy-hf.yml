name: Deploy to Hugging Face Spaces

# Needs repository secret HF_TOKEN (write access) and variable HF_SPACE_ID, e.g. "username/airquality-paca".
on:
  push:
    branches: [main]
    paths-ignore: ["notebooks/**", "images/**", "README.md"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-hf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "::notice::HF_TOKEN secret or HF_SPACE_ID variable not set; skipping deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          # the daily job pushes new data before calling this workflow
          ref: main

      - name: Stage Space files
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p space/data/processed
          cp -r Api airquality app.py models requirements-api.txt space/
          cp data/processed/df_raw_cleaned.csv space/data/processed/
          cp -r data/reference data/live space/data/
          mkdir -p space/monitoring
          cp monitoring/*.json monitoring/*.csv space/monitoring/ 2>/dev/null || true
          cp deploy/huggingface/Dockerfile deploy/huggingface/start.sh deploy/huggingface/README.md space/
          find space -name "__pycache__" -prune -exec rm -rf {} +
          du -sh space

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          python-version: "3.10"

      - name: Upload to Space
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE_ID"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="space",
              commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}",
              # drop observation/forecast partitions pruned in the GitHub repo
              delete_patterns=["data/live/**"],
          )
          print(f"Deployed to https://huggingface.co/spaces/{space}")
          EOF
