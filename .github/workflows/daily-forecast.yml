name: Daily forecast

# The daily run happens on Hugging Face Jobs (scripts/daily_pipeline.py, set up with
# scripts/setup_hf_job.py). This workflow is the manual fallback: Actions → Daily forecast → Run workflow.
# Do not re-enable a schedule here while the Hugging Face job is active: both would push and deploy.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of Geod'Air data to (re)download. 'auto' = 3, or back to the last stored day after missed runs (max 30)"
        default: "auto"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            constraints.txt

      - name: Install dependencies (exact versions from constraints.txt)
        run: pip install -r requirements-pipeline.txt -c constraints.txt

      # Gate: code pushed to main is not published unless the tests pass on it,
      # even if CI on that push did not run.
      - name: Run tests
        run: pytest -q

      - name: Pull new Geod'Air data
        env:
          DAYS: ${{ inputs.days || 'auto' }}
        run: python scripts/fetch_geodair.py --days "$DAYS"

      - name: Make 24h forecasts
        run: python scripts/make_forecasts.py

      - name: Monitor drift and forecast skill
        id: monitor
        run: python scripts/monitor_drift.py --window-days 7

      - name: Build static forecast page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build_site.py

      - name: Upload Evidently report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drift-report-${{ github.run_id }}
          path: monitoring/drift_report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit new data and forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live monitoring/drift_summary.json monitoring/history.csv site/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily update: Geod'Air data, forecasts and drift report ($(date -u +%F))"
            git pull --rebase
            git push
          fi

      - name: Open or update drift issue
        if: steps.monitor.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python - <<'EOF'
          import json
          s = json.load(open("monitoring/drift_summary.json", encoding="utf-8"))
          d = s["drift"]
          cols = [c for c, v in d["columns"].items() if v["drifted"]]
          skill = s.get("skill") or {}
          print(f"Data drift detected on {s['run_date']} (window {s['window']['start']} to {s['window']['end']}).\n")
          print(f"- Drifted columns: {d['n_drifted']}/{d['n_columns']} ({', '.join(cols)})")
          if skill:
              print(f"- Forecast MAE {skill['mae']} vs persistence {skill['persistence_mae']}")
          print(f"\nFull Evidently report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          EOF
          )
          gh label create data-drift --color D93F0B --description "Raised by the daily drift monitor" 2>/dev/null || true
          issue=$(gh issue list --label data-drift --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Data drift detected" --label data-drift --body "$body"
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy-hf.yml
    secrets: inherit

  # A failed run leaves yesterday's page live; make sure someone hears about it.
  # (This cannot fire if Actions itself is unavailable, e.g. a billing lock: see docs/RELEASE.md.)
  report-failure:
    needs: [update, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update pipeline-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Daily forecast run failed on $(date -u +%F): update=${{ needs.update.result }}, deploy=${{ needs.deploy.result }}. The live page still shows the previous forecast. Logs: $RUN_URL"
          gh label create pipeline-failure --color B60205 --description "Raised when the daily pipeline fails" 2>/dev/null || true
          issue=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Daily forecast pipeline failing" --label pipeline-failure --body "$body"
          fi
