name: Daily forecast

on:
  schedule:
    # 04:30 UTC: yesterday's Geod'Air file is complete by then
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Pull new Geod'Air data
        run: python scripts/fetch_geodair.py --days 3

      - name: Make 24h forecasts
        run: python scripts/make_forecasts.py

      - name: Monitor drift and forecast skill
        id: monitor
        run: python scripts/monitor_drift.py --window-days 7

      - name: Build static forecast page
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python scripts/build_site.py

      - name: Upload Evidently report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: monitoring/drift_report.html
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit new data and forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/live monitoring/drift_summary.json monitoring/history.csv site/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily update: Geod'Air data, forecasts and drift report ($(date -u +%F))"
            git pull --rebase
            git push
          fi

      - name: Open or update drift issue
        if: steps.monitor.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(python - <<'EOF'
          import json
          s = json.load(open("monitoring/drift_summary.json", encoding="utf-8"))
          d = s["drift"]
          cols = [c for c, v in d["columns"].items() if v["drifted"]]
          skill = s.get("skill") or {}
          print(f"Data drift detected on {s['run_date']} (window {s['window']['start']} to {s['window']['end']}).\n")
          print(f"- Drifted columns: {d['n_drifted']}/{d['n_columns']} ({', '.join(cols)})")
          if skill:
              print(f"- Forecast MAE {skill['mae']} vs persistence {skill['persistence_mae']}")
          print(f"\nFull Evidently report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          EOF
          )
          gh label create data-drift --color D93F0B --description "Raised by the daily drift monitor" 2>/dev/null || true
          issue=$(gh issue list --label data-drift --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Data drift detected" --label data-drift --body "$body"
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/deploy-hf.yml
    secrets: inherit
