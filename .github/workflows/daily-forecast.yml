name: Daily forecast

# The main daily runner. All steps live in scripts/daily_pipeline.py, which the PC backup
# (scripts/run_local_backup.ps1) also runs when GitHub has not published by the evening.
on:
  schedule:
    # 04:30 UTC: yesterday's Geod'Air file is complete by then
    # (GitHub often starts scheduled runs hours late; that is expected)
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days of Geod'Air data to (re)download. 'auto' = 3, or back to the last stored day after missed runs (max 30)"
        default: "auto"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-*.txt
            constraints.txt

      - name: Install dependencies (exact versions from constraints.txt)
        run: pip install -r requirements-pipeline.txt huggingface_hub==2.4.0 -c constraints.txt

      - name: Run the daily pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          GITHUB_ISSUES_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          AQ_RUNNER: GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DAYS: ${{ inputs.days || 'auto' }}
          # a scheduled run stands down if the backup already published today; manual runs always run
          SKIP: ${{ github.event_name == 'schedule' && '--skip-if-published-today' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/daily_pipeline.py --days "$DAYS" $SKIP

      - name: Upload Evidently report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drift-report-${{ github.run_id }}
          path: monitoring/drift_report.html
          if-no-files-found: ignore
          retention-days: 30

  # daily_pipeline.py raises the issue for failures inside the pipeline; this covers the rest
  # (checkout, install). It cannot fire if Actions itself is unavailable: the PC backup covers that.
  report-failure:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open or update pipeline-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Daily forecast run failed on $(date -u +%F). Logs: $RUN_URL"
          gh label create pipeline-failure --color B60205 --description "Raised when the daily pipeline fails" 2>/dev/null || true
          issue=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Daily forecast pipeline failing" --label pipeline-failure --body "$body"
          fi
