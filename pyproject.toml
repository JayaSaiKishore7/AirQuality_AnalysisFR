[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# bug-finding rules only (pyflakes, syntax/runtime errors, bugbear); style is not gated in CI
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # raised inside pandas 2.x datetime arithmetic with numpy >= 2.4
    "ignore:\\s*The 'generic' unit for NumPy timedelta:DeprecationWarning",
]
